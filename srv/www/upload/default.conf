server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root ./srv/www;
    index index.html;
    autoindex off;

    allow_methods GET POST DELETE;
    upload_path upload;

    location /readonly/ {
        allow_methods GET;
    }

    location /upload/ {
        allow_methods GET POST DELETE;
        upload_path upload;
    }

    location /list/ {
        allow_methods GET;
        autoindex on;
    }

    location /no-list/ {
        allow_methods GET;
        autoindex off;
    }

    location /default/ {
        allow_methods GET;
        index home.html;
    }

    location /old/ {
        return 301 /new/;
    }

    location /cgi/ {
        root ./srv/www;
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/sh;
    }
}
