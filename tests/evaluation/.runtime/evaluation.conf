server {
    listen 127.0.0.1:18080;
    server_name eval.local;
    root /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/site;
    index index.html;
    autoindex off;
    max_body_size 100;
    allow_methods GET POST DELETE;
    upload_path upload;

    error_page 400 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/400.html;
    error_page 403 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/403.html;
    error_page 404 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/404.html;
    error_page 405 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/405.html;
    error_page 409 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/409.html;
    error_page 411 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/411.html;
    error_page 413 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/413.html;
    error_page 414 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/414.html;
    error_page 415 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/415.html;
    error_page 423 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/423.html;
    error_page 500 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/500.html;
    error_page 501 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/501.html;
    error_page 502 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/502.html;
    error_page 504 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/504.html;
    error_page 505 /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/errors/505.html;

    location /readonly/ {
        allow_methods GET;
    }

    location /upload/ {
        allow_methods GET POST DELETE;
        upload_path upload;
    }

    location /multipart/ {
        allow_methods POST;
        upload_path upload;
        max_body_size 1M;
    }

    location /list/ {
        allow_methods GET;
        autoindex on;
    }

    location /no-list/ {
        allow_methods GET;
        autoindex off;
    }

    location /default/ {
        allow_methods GET;
        index home.html;
    }

    location /mapped/ {
        alias /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/mapped;
        allow_methods GET;
    }

    location /old/ {
        return 301 /new/;
    }

    location /cgi/ {
        root /Users/Knight/Desktop/42/ghweb/tests/evaluation/.runtime/site;
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/sh;
    }
}
