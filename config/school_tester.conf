server {
    listen       0.0.0.0:8080;
    server_name  localhost;

    root         ./tester_data/YoupiBanane;
    index        youpi.bad_extension;
    max_body_size 10M;

    # 1. / 路由：只允许 GET 请求！
    location / {
        root          ./tester_data/YoupiBanane;
        index         youpi.bad_extension;
        autoindex     off;
        allow_methods GET;   # 👈 严格限制只能 GET，POST 请求会触发 405
        cgi_extension .bla ./tester_data/cgi_tester;
    }

    # 2. /post_body 路由：限制 max_body_size 为 100 字节
    location /post_body {
        root          ./tester_data/YoupiBanane;
        upload_path   uploads;
        allow_methods POST;
        max_body_size 100;   # 👈 改为 100 字节（用于测试 413 Payload Too Large）
    }

    # 3. /directory/ 路由：允许 GET 和 POST，并执行 cgi_tester
    location /directory/ {
        root          ./tester_data/YoupiBanane;
        index         youpi.bad_extension;
        autoindex     on;
        allow_methods GET POST;
        cgi_extension .bla ./tester_data/cgi_tester;
    }
}