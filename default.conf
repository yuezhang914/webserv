server {
    listen 0.0.0.0:8080;
    server_name localhost lilou;
    root ./srv/www;

    index index/ index.html;
    error_page 404 /custom_404.html;
    error_page 502 /custom_502.html;
    error_page 504 /custom_504.html;
    error_page 413 /custom_413.html;
    error_page 405 /custom_405.html;
    error_page 501 /custom_501.html;
    error_page 502 /custom_502.html;
    error_page 403 /custom_403.html;
    
    max_body_size       1M;
    allow_methods GET ;
    autoindex off;

    location / {
        root ./srv/www;
        allow_methods GET;
    }

    location /upload {
        root ./srv/www;   
        autoindex on;      
        upload_path ./upload;         
        allow_methods POST DELETE GET;
        max_body_size       2M;
    }

    # Session Bonus 使用内建虚拟路由，不依赖磁盘文件。
    # ResponseBuilder 会先检查 EffectiveRoute 的 allow_methods，再分发到
    # /session/counter、/session/login、/session/logout，因此这里需要同时允许 GET/POST。
    location /session {
        allow_methods GET POST;
    }

    location /test_dir {
    root ./srv/www;
    autoindex on; # 👈 显式开启目录列表展示
    }

    location /test/index.html {
        allow_methods GET;
    }

    location /redirect_ext {
       return 301 http://google.com; 
    }

    location /redirect_int {
       return 302 /index.html; 
    }

    location /cgi {
        root ./srv/www; 
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }

    location /cgi-php {
        root ./srv/www/cgi-scripts;
        allow_methods GET POST;
        cgi_extension .php /usr/bin/php-cgi;
    }

    location /login {
        root ./srv/www/login;
        index login_index.html;
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }

    location /auth {
        alias ./srv/www/auth;             # 👈 使用 alias 替换 root
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }

    location /logout {
        root ./srv/www/logout;
        allow_methods POST;
        cgi_extension .py /usr/bin/python3;
    }

    location /files {
        root ./srv/www/files;
        autoindex on;
    }
}

server {
    listen 0.0.0.0:8081;
    server_name cat.com;
    index cat_index.html;
    root ./srv/www;
    error_page 404 /custom_404.html;

    max_body_size       10M;
    allow_methods GET POST;
}

server {
    listen 0.0.0.0:8083;
    server_name dog.com;
    index dog_index.html;
    root ./www;
    error_page 404 /custom_404.html;
 
    max_body_size       10M;
    allow_methods GET POST;
}

